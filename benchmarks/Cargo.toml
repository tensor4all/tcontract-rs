[package]
name = "tcontract-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Benchmarks for the tcontract stack"

[lib]
path = "src/lib.rs"
bench = false

[dependencies]
tcontract-exec = { workspace = true, features = ["strided"] }
tcontract-kernel = { workspace = true }
tcontract = { workspace = true }
tcontract-capi = { workspace = true }
strided-basic = { workspace = true }
strided-view = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.3"
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Re-export the packed driver's per-phase timing so a harness can report which phase
# an anomalous case spends its time in.
phase-timing = ["tcontract/phase-timing"]
default = []
# Link the C++ TBLIS baseline. Requires TBLIS_ROOT to point at an install
# prefix containing lib/libtblis.{so,a}.
tblis = []
# Target the TBLIS 1.3.0 ABI instead of 2.x. The two releases swap the
# TYPE_DOUBLE and TYPE_SCOMPLEX enumerators, which is a silent mismatch, so the
# harness self-checks at startup.
tblis13 = ["tblis"]
# Link a CBLAS-compatible BLAS for the TTGT (transpose-transpose-GEMM-transpose)
# baseline. Requires BLAS_ROOT or a system libopenblas.
blas = []
# Satisfy `blas` with Apple's Accelerate framework instead of OpenBLAS. macOS
# only; needs no install and no root variable.
#
# **Accelerate is not a like-for-like substitute and must not be quoted as this
# project's GEMM roofline.** Its GEMM reaches Apple's undocumented AMX matrix
# coprocessor, which no NEON kernel can target. Against Accelerate the ratio is
# an *off-ISA* comparison, so OpenBLAS is the roofline and Accelerate is reported
# beside it and labelled (decision D55 of the original harness).
#
# It also has no `openblas_set_num_threads`; pin it with the environment variable
# `VECLIB_MAXIMUM_THREADS=1`, which the harness cannot do for you because
# Accelerate reads it once at first use.
accelerate = ["blas"]

[[bin]]
name = "capi_rust"
path = "benchmarks/tcontract/capi_rust.rs"

[[bin]]
name = "contract"
path = "benchmarks/tcontract/contract/contract.rs"

[[bin]]
name = "tcbench"
path = "benchmarks/tcbench/main.rs"

[[bin]]
name = "lukbench"
path = "benchmarks/lukbench/main.rs"

[[bin]]
name = "exec_entry"
path = "benchmarks/tcontract/exec_entry/exec_entry.rs"

[lints]
workspace = true
