[package]
name = "tcontract"
version = "0.7.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>"]
publish = true
description = "Binary tensor contraction for the tcontract stack: one Problem, a packed TBLIS-style driver, faer and elementwise strategies"

[dependencies]
faer = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
strided-basic = { workspace = true, features = ["parallel"] }
strided-view = { workspace = true }
thiserror = { workspace = true }
tinyvec = { workspace = true }
tcontract-exec = { workspace = true, features = ["faer"] }
threadteam = { workspace = true }
tcontract-kernel = { workspace = true, features = ["std"] }

[features]
# Optional per-phase timing of the packed driver, for measurement. Off by default
# and free when off: every call site is `#[cfg]`-gated.
phase-timing = []

[dev-dependencies]
rand = { workspace = true }
rand_chacha = "0.3"
threadteam = { workspace = true, features = ["ledger"] }
tcontract-testkit = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "overhead_smoke"
harness = false
