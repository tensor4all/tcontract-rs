[package]
name = "tcontract-exec"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = true
description = "Execution resources for the tcontract stack: the per-call Exec bundle (threadteam token, workspace, batch policy) and the Pool wrapper with its scratch arena"
readme = "README.md"

[dependencies]
threadteam = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
threadteam = { workspace = true, features = ["ledger"] }

[lints]
workspace = true
