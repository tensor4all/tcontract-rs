[package]
name = "tcontract-kernel"
description = "GEMM kernels: family contract and registry, packing, write-back, cache blocking and the project-owned microkernel families"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>"]
publish = true

[dependencies]
num-complex.workspace = true

[dev-dependencies]
# Path-only cross-layer test dependencies (the downstream driver exercises the
# kernels); not a runtime dependency.
libc = "0.2"

[features]
default = ["std"]
std = []

[lints]
workspace = true
