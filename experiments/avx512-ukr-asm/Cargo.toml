[package]
name = "avx512-ukr-asm"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Isolated experiment: freeze the AVX-512 f64 24x8 real micro-kernel's compiler asm and A/B it against the intrinsic kernel"

[dependencies]
tcontract-kernel = { path = "../../crates/tcontract-kernel" }

# The frozen `.S` is the per-crate `--emit=asm` codegen (no cross-crate LTO
# pass), so LTO is disabled here to make the intrinsic arm the *same* codegen
# as the frozen body — a like-for-like instruction comparison. This is also set
# in `.cargo/config.toml` for reproducibility.
[profile.release]
opt-level = 3
lto = false
codegen-units = 1

# Standalone: excluded from the parent workspace (root Cargo.toml
# `exclude = ["experiments"]`), so this is its own workspace root.
[workspace]

[profile.dev]
debug = 0

[profile.test]
debug = 0
