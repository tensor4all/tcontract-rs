[package]
name = "faer-item-width"
version = "0.0.0"
edition = "2021"
publish = false
description = "Time per call of a rank-2 Faer plan at each item width, and the width the plan chooses (tcontract-rs#194)"

# A standalone crate: excluded from the root workspace, like the other probes
# under `experiments/`. Its lock is the root lock plus this package.
[dependencies]
num-complex = "0.4"
strided-view = "0.8.1"
tcontract = { path = "../../crates/tcontract" }
tcontract-exec = { path = "../../crates/tcontract-exec" }
threadteam = "0.6"

# Same release profile as the root workspace, so the probe measures the
# shipped codegen.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

[workspace]
