[package]
name = "three-engine-contract"
version = "0.0.0"
edition = "2021"
publish = false
description = "tcontract vs tensorprimitives-rs vs tenferro on the per-shape corpus of issue #61"

# A standalone crate (the root workspace excludes `experiments/`): tenferro-rs
# pins strided-rs v0.4.4 and tcontract v0.4.5, and the two must not be unified.
[dependencies]
num-complex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "c12d96fa4cfef622bc1f15fd9940fd418fb686ac", version = "0.4.5" }
tcontract = { path = "../../crates/tcontract" }
tcontract-exec = { path = "../../crates/tcontract-exec", features = ["strided"] }
# cpueinsum-rs (local checkout) for the cpueinsum arms; its tcontract git
# dependency is patched onto this tree so the two unify.
cpueinsum = { path = "../../../cpueinsum-rs/crates/cpueinsum" }
# lkdvos/tensorprimitives-rs, the commit docs/provenance.md records.
tensorcontract = { git = "https://github.com/lkdvos/tensorprimitives-rs.git", rev = "8cda75e11ed26f46c0c22f9629004c84dbabc8e5" }
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "8402ad24" }
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "8402ad24" }
tenferro-einsum = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "8402ad24", features = ["autodiff"] }
tenferro-ad = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "8402ad24" }
tenferro-runtime = { git = "https://github.com/tensor4all/tenferro-rs.git", rev = "8402ad24" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch."https://github.com/tensor4all/tcontract-rs.git"]
tcontract = { path = "../../crates/tcontract" }
tcontract-exec = { path = "../../crates/tcontract-exec" }
tcontract-kernel = { path = "../../crates/tcontract-kernel" }

[workspace]

[profile.dev]
debug = 0

[profile.test]
debug = 0
