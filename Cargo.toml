[workspace]
resolver = "2"
members = [
    "crates/tprims-kernel",
    "crates/tprims-exec",
    "crates/tprims-contract",
    "crates/tprims-testkit",
    "crates/tprims-capi",
    "benchmarks",
]
exclude = ["experiments"]

[workspace.package]
edition = "2021"
# 1.89 stabilised the AVX-512 intrinsics and `is_x86_feature_detected!`, which
# the packed driver's kernels need (imported tensorprimitives-rs decision D20).
rust-version = "1.89"

[workspace.dependencies]
# strided-rs published v0.4.6, including #290's terminal-pointer safety correction. Keep all
# strided crates on one source; downstream consumers must coordinate this pin
# to share `StridedView` types.
strided-basic = { git = "https://github.com/tensor4all/strided-rs.git", rev = "9fa651152d0b891b8f2f65a8f786a3058b3ed2e9", version = "=0.4.7", default-features = false }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "9fa651152d0b891b8f2f65a8f786a3058b3ed2e9", version = "=0.4.7" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "9fa651152d0b891b8f2f65a8f786a3058b3ed2e9", version = "=0.4.7" }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs.git", rev = "9fa651152d0b891b8f2f65a8f786a3058b3ed2e9", version = "=0.4.7" }
tprims-kernel = { version = "0.1.0", path = "crates/tprims-kernel", default-features = false }
tprims-exec = { version = "0.1.0", path = "crates/tprims-exec" }
tprims-capi = { version = "0.1.0", path = "crates/tprims-capi" }
tprims-testkit = { version = "0.1.0", path = "crates/tprims-testkit" }
tprims-contract = { version = "0.1.0", path = "crates/tprims-contract" }

approx = "0.5"
criterion = "0.5"
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
faer-traits = "0.24"
num-complex = "0.4"
num-traits = "0.2"
pulp = "0.22"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
smallvec = "1"
thiserror = "1.0"

# Workspace tests instantiate large generic kernels in many executables.
# Omitting debuginfo keeps those artifacts small while preserving debug
# assertions and overflow checks from Cargo's default development profiles.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Hosted CI starts from cold caches, where incremental state has no value.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"

[profile.release-with-debug]
inherits = "release"
debug = true

# These two lints fire on index-driven numerical kernels and wide kernel
# signatures, where the suggested rewrites change loop structure in hot paths;
# they stay allowed workspace-wide rather than being "fixed" without a
# benchmark.
[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
# New in clippy 1.98: suggests `as_chunks` for constant-size `chunks_exact` in
# hot reduction loops; rewriting them needs a benchmark first.
chunks_exact_to_as_chunks = "allow"
