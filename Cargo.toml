[workspace]
resolver = "2"
members = [
    "crates/tcontract-kernel",
    "crates/tcontract-exec",
    "crates/tcontract",
    "crates/tcontract-testkit",
    "crates/tcontract-capi",
    "benchmarks",
]
exclude = ["experiments"]

[workspace.package]
edition = "2021"
# 1.89 stabilised the AVX-512 intrinsics and `is_x86_feature_detected!`, which
# the packed driver's kernels need (imported tensorprimitives-rs decision D20).
rust-version = "1.89"

[workspace.dependencies]
# strided-rs, pinned to a published release (the exact requirement is on each line
# below). Keep all strided crates on one source; downstream consumers must
# coordinate this pin to share `StridedView` types.
strided-basic = { git = "https://github.com/tensor4all/strided-rs.git", rev = "d9cbae8519d1f0df0159d6d23af31ae53aefd571", version = "=0.5.2", default-features = false }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "d9cbae8519d1f0df0159d6d23af31ae53aefd571", version = "=0.5.0" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "d9cbae8519d1f0df0159d6d23af31ae53aefd571", version = "=0.5.0" }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs.git", rev = "d9cbae8519d1f0df0159d6d23af31ae53aefd571", version = "=0.5.0" }
tcontract-kernel = { version = "0.2.2", path = "crates/tcontract-kernel", default-features = false }
tcontract-exec = { version = "0.2.2", path = "crates/tcontract-exec" }
tcontract-capi = { version = "0.1.0", path = "crates/tcontract-capi" }
# Path-only on purpose: `tcontract` only dev-depends on it, and a version here
# makes `cargo package` resolve the never-published testkit from crates.io and fail.
tcontract-testkit = { path = "crates/tcontract-testkit" }
tcontract = { version = "0.2.0", path = "crates/tcontract" }

approx = "0.5"
criterion = "0.5"
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
faer-traits = "0.24"
num-complex = "0.4"
num-traits = "0.2"
pulp = "0.22"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
smallvec = "1"
thiserror = "1.0"

# Workspace tests instantiate large generic kernels in many executables.
# Omitting debuginfo keeps those artifacts small while preserving debug
# assertions and overflow checks from Cargo's default development profiles.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Hosted CI starts from cold caches, where incremental state has no value.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

# The optimized gate. `release` is the *shipping* configuration: thin LTO, one codegen
# unit and `opt-level = 3` are what the kernels are tuned against, and they are what the
# linked artifacts and every recorded experiment use. What a test gate needs from it is
# the other half -- `debug-assertions` and `overflow-checks` off, and a build the
# compiler optimizes rather than a debug one -- so this profile inherits all of that and
# pays only what is worth paying for.
#
# Measured on a 24-thread host with warm dependencies, `cargo test -p tcontract --no-run`
# (the package and its test targets): 72.6 s under `release` and 17.1 s under
# `release-test`, i.e. thin LTO and one codegen unit cost 4.2x for nothing this job can
# see. Measured again on four CPUs, the shape of a hosted runner, across the level:
#
#     opt-level = 1   26.4 s      auto-vectorization off
#     opt-level = 2   34.3 s      <- this profile
#     opt-level = 3   36.2 s      what `release` uses
#
# Level 2 keeps vectorization -- the codegen feature the packed kernels are built
# around -- and level 3's last few per cent buy a gate nothing. The shipping profile
# itself is still built and linked, and its library run, by `c-consumer`.
[profile.release-test]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
debug = 0

[profile.bench]
inherits = "release"

[profile.release-with-debug]
inherits = "release"
debug = true

# These two lints fire on index-driven numerical kernels and wide kernel
# signatures, where the suggested rewrites change loop structure in hot paths;
# they stay allowed workspace-wide rather than being "fixed" without a
# benchmark.
[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
# New in clippy 1.98: suggests `as_chunks` for constant-size `chunks_exact` in
# hot reduction loops; rewriting them needs a benchmark first.
chunks_exact_to_as_chunks = "allow"