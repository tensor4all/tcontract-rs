name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Each Rust job restores `Swatinem/rust-cache` and only a push to main writes it, so
# a pull request restores a cache built from default-branch content and never
# publishes one from PR-controlled content. The key includes the job id, the OS, the
# rustc version and a hash of the lockfile and the workflow env (which is where
# `RUSTFLAGS` enters it), so jobs do not share an entry by accident. Nothing here was
# cached before: the `test` job compiled all 135 lockfile packages from scratch in
# three profiles and was 13.1 minutes on ubuntu and 17.1 on macOS, against 2.3 minutes
# for every other job, i.e. it set the whole wall clock of CI (17.8 and 18.8 minutes
# for the two main runs before this change).
#
# The optimized profile (see `release-test` in `Cargo.toml`) recompiles the dependency
# tree again, so it lives in its own job: its cache entry is then independent of the
# `ci` profile the `test` job uses, and neither job pays for the other's profile.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Only `threadteam` starts tasks on a thread pool (shared rule 1 of
  # tensor4all-meta, "Where placement is decided"): a direct rayon dependency
  # anywhere else is rejected, and no rayon type is public in tcontract-exec.
  placement:
    name: placement rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only threadteam (and vendor wrappers) depend on rayon
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      - name: No rayon type in the public API of tcontract-exec
        run: scripts/check-no-public-rayon.sh

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-agent-skills.py
      - run: python3 benchmarks/scripts/test_idle_cpus.py
      - run: python3 benchmarks/scripts/test_tblis_decision.py
      - run: bash -n benchmarks/scripts/pinned.sh benchmarks/scripts/paired.sh benchmarks/scripts/build_tblis.sh benchmarks/benchmarks/tcontract/contract/run.sh benchmarks/c/run.sh

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      # The C ABI test (in `capi`) links a C program to libtcontract_capi.so, which `cargo test`
      # does not build (it only builds the rlib the harness needs).
      - run: cargo build --profile ci -p tcontract-capi
      - run: cargo test --profile ci --workspace --no-fail-fast
      # The allocation-free overhead smoke gates: ratio guard, same-run measurement,
      # OVERHEAD_GATE turns a failed ratio into a non-zero exit. One OS is enough; the
      # subject is the per-call overhead, not the platform.
      - name: Overhead smoke gates (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: OVERHEAD_GATE=1 cargo bench --profile release -p tcontract --bench overhead_smoke

  # The packed driver's micro-kernels are written for an optimized build, so the suites
  # run once more under `release-test` (see `Cargo.toml` for the profile and what it
  # keeps). It is deliberately not the shipping build: thin LTO and one codegen unit cost
  # 4.2x for nothing a test can see, and `opt-level = 2` keeps the vectorization the
  # kernels are built around. The shipping profile is still built, linked and run by
  # `c-consumer`.
  #
  # One OS, not two: this gate's subject is the profile, not the platform, and the `test`
  # job already covers both. The three steps share one build, so `tcbench` and the README
  # example are smoke runs of binaries, not a second optimized compile.
  test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test -p tcontract --profile release-test
      - run: cargo run --profile release-test -p tcontract-bench --bin tcbench -- info
      # The README's Rust example.
      - run: cargo run --profile release-test -p tcontract --example readme

  capi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      # The C test (tests/c_abi.rs) compiles and runs C and C++ programs
      # against the built libtcontract_capi.so, one of them against the pinned upstream
      # TAPP headers alone.
      - run: cargo build -p tcontract-capi
      - run: cargo test -p tcontract-capi
      # Exported symbols: ELF `nm -D` on Linux; Mach-O `nm -gU` on macOS, where
      # C names carry a leading underscore (` _name`).
      - run: |
          if [ "$RUNNER_OS" = macOS ]; then
            syms=$(nm -gU target/debug/libtcontract_capi.dylib | sed 's/ _/ /')
          else
            syms=$(nm -D --defined-only target/debug/libtcontract_capi.so)
          fi
          echo "$syms" | grep -q ' tcontract_abi_version$'
          echo "$syms" | grep -q ' TAPP_destroy_executor$'
          echo "$syms" | grep -q ' TAPP_create_tensor_product$'
          ! echo "$syms" | grep -q ' tcontract_blas_'

  c-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo build --release -p tcontract-capi
      # A prebuilt library, then an installed prefix (the layout install.sh
      # produces), each consumed by the CMake example.
      - run: |
          cmake -S examples/c-consumer -B build/prebuilt -DTAPP_USE_CORROSION=OFF
          cmake --build build/prebuilt
          ./build/prebuilt/tapp-c-consumer
      - run: |
          crates/tcontract-capi/install.sh --prefix="$PWD/build/prefix"
          cmake -S examples/c-consumer -B build/installed -DTAPP_PREFIX="$PWD/build/prefix"
          cmake --build build/installed
          LD_LIBRARY_PATH="$PWD/build/prefix/lib" ./build/installed/tapp-c-consumer

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo build --workspace --all-targets

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
